name: CI

# Upstream cage's workflow ran on 'master' in an Alpine/Arch matrix; this
# repository's branch is 'main', and what ships is a Debian trixie package, so
# it never ran and would not have tested the right thing. This builds the
# package the image installs, in the distribution it installs into.
#
# The behaviour gates (make test: session, lock, secure, privileged, SAS)
# need sg-session and wine-sg beside this repo and a headless session; they
# run locally and in sg-image's boot gate, not here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deb:
    name: build .deb (Debian trixie)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential devscripts debhelper equivs make ca-certificates
          apt-get build-dep -y --no-install-recommends ./

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect package
        run: mkdir -p dist && cp ../sg-compositor_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: sg-compositor-deb
          path: dist/*.deb
